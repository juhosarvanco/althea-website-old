# Althea — Netlify configuration
#
# site/ is the whole published site. internal/ and project/ stay in the repo
# as reference material and are never deployed.

[build]
  publish = "site"
  command = "node tools/prepare-deploy.mjs"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Asset filenames carry a content hash (see tools/flatten.py), so a given URL
# never changes meaning and can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # SAMEORIGIN, not DENY: /admin previews the live page in an iframe.
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Keep drafts and previews out of search results entirely.
[[context.deploy-preview.headers]]
  for = "/*"
  [context.deploy-preview.headers.values]
    X-Robots-Tag = "noindex, nofollow"
